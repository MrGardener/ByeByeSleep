name: Latest APK

# Publishes the newest build of main as a plain .apk download (no zip) at
# https://github.com/MrGardener/ByeByeSleep/releases/download/latest-apk/ByeByeSleep.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --release --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk ByeByeSleep.apk
          (cd android && ./gradlew :wear:assembleRelease -PwatchVersionCode="${{ github.run_number }}")
          cp build/wear/outputs/apk/release/wear-release.apk ByeByeSleep-watch.apk
      - name: Replace the latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk ByeByeSleep.apk ByeByeSleep-watch.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (main)" \
            --notes "Newest build of main (${GITHUB_SHA::7}). Debug-signed test build: tap ByeByeSleep.apk to download and install. ByeByeSleep-watch.apk is the Pixel Watch app (see docs/watch-install.md). ByeByeSleep.ipa is the unsigned iPhone build, added a few minutes later (see docs/iphone-install.md)."

  ios:
    runs-on: macos-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Unsigned IPA
        run: |
          flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ByeByeSleep.ipa Payload
      - name: Add it to the latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest-apk ByeByeSleep.ipa --clobber
