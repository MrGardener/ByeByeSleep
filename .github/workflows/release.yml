name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_NOTE=Pre-release: this APK is debug-signed (no release keystore configured). Installing a later signed release will require uninstalling this one, which deletes its alarms." >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "SIGNING_NOTE=" >> "$GITHUB_ENV"
          echo "PRERELEASE=false" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          flutter build apk --release --build-name "${GITHUB_REF_NAME#v}" --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "ByeByeSleep-${GITHUB_REF_NAME}.apk"
          (cd android && ./gradlew :wear:assembleRelease -PwatchVersionCode="${{ github.run_number }}")
          cp build/wear/outputs/apk/release/wear-release.apk "ByeByeSleep-watch-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ByeByeSleep-${{ github.ref_name }}.apk
            ByeByeSleep-watch-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: ${{ env.SIGNING_NOTE }}
          prerelease: ${{ env.PRERELEASE == 'true' }}

  ios:
    runs-on: macos-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Needs the iOS 26 SDK (AlarmKit)
        run: |
          v=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $v"
          [ "${v%%.*}" -ge 26 ]
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Unsigned IPA
        run: |
          flutter build ios --release --no-codesign --build-name "${GITHUB_REF_NAME#v}" --build-number "${{ github.run_number }}"
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "ByeByeSleep-${GITHUB_REF_NAME}.ipa" Payload
      - uses: softprops/action-gh-release@v3
        with:
          files: ByeByeSleep-${{ github.ref_name }}.ipa
